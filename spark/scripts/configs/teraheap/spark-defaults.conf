# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
spark.master                      spark://ampere:7077
spark.eventLog.enabled            true
#spark.eventLog.dir                /opt/carvguest/asplos23_ae/tera_applications/spark/spark-3.3.0/logs
spark.eventLog.dir                $TERA_APPS_HOME/spark/spark-3.3.0/logs
#spark.metrics.conf                /opt/carvguest/asplos23_ae/tera_applications/spark/spark-3.3.0/metrics.properties
spark.metrics.conf                $TERA_APPS_HOME/spark/spark-3.3.0/metrics.properties
spark.serializer                  org.apache.spark.serializer.KryoSerializer

spark.executor.extraJavaOptions   -server -XX:+ExitOnOutOfMemoryError -XX:-ClassUnloading -XX:+UseG1GC -XX:ParallelGCThreads=16 -XX:ConcGCThreads=4 -XX:G1HeapWastePercent=0 -XX:+EnableTeraHeap -XX:TeraHeapSize=1230508130304 -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -XX:TeraStripeSize=32768 -XX:-ResizeTLAB -XX:G1HeapWastePercent=0 -XX:-ResizePLAB -XX:TeraDRAMLimit=19327352832 -XX:TeraResizingPolicy=7 -XX:AllocateH2At="/spare/s1/perpap/fmap/" -XX:H2FileSize=1288490188800 -XX:TeraCPUStatsPolicy=0 -XX:TeraHeapPolicy=SparkPrimitivePolicy -XX:+DynamicHeapResizing -XX:+ShowMessageBoxOnError
#spark.executor.extraJavaOptions   -server -XX:-ClassUnloading -XX:ParallelGCThreads=8 -XX:+EnableTeraHeap -XX:TeraHeapSize=1230508130304 -Xms54g -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -XX:+TeraHeapStatistics -Xlogth:teraHeap.txt -XX:TeraHeapPolicy="DefaultPolicy" -XX:TeraStripeSize=32768 -XX:+ShowMessageBoxOnError -XX:+DynamicHeapResizing -XX:TeraDRAMLimit=19327352832 -XX:TeraResizingPolicy=7 -XX:AllocateH2At="/spare/s1/perpap/fmap/" -XX:H2FileSize=1288490188800 -XX:TeraCPUStatsPolicy=0

#spark.executor.cores                 16
spark.executor.memory                68g
spark.executor.memoryOverhead        20g
#spark.executor.extraJavaOptions      -Xms68g -XX:MaxDirectMemorySize=4g -XX:+ExitOnOutOfMemoryError -XX:+ShowMessageBoxOnError -XX:+EnableTeraHeap -XX:+TeraHeapStatistics -Xlogth:teraHeap.txt XX:TeraCPUStatsPolicy=0 XX:TeraStripeSize=32768 -XX:TeraHeapPolicy=SparkPrimitivePolicy -XX:+DynamicHeapResizing -XX:TeraDRAMLimit=19327352832 -XX:TeraResizingPolicy=7 -XX:TeraHeapSize=1230508130304 -XX:AllocateH2At=/spare/s1/perpap/fmap/ -XX:H2FileSize=1073741824000 -XX:+UseParallelGC -XX:ParallelGCThreads=4 -XX:-UseCompressedOops -XX:-UseCompressedClassPointers
#spark.executorEnv.MALLOC_ARENA_MAX   2


spark.teraheap.enabled   true
spark.teraheap.heap.size 1200g

spark.memory.storageFraction 0.9

#spark.driver.memory              10g
spark.driver.memory              16g
#spark.driver.extraJavaOptions    -server -XX:+UseParalellGC -XX:-EnableTeraHeap -XX:-UseCompressedOops -XX:-UseCompressedClassPointers
spark.driver.extraJavaOptions    -server -XX:+UseG1GC -XX:-ResizePLAB -XX:-ResizeTLAB -XX:-UseCompressedOops -XX:-UseCompressedClassPointers
spark.network.timeout             10000s
spark.executor.heartbeatInterval  999s
spark.rpc.numRetries              8000

